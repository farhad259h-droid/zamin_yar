<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زمین‌یار | نسخه ۱.۱</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2f4f7;
    font-family: Tahoma, Arial, sans-serif;
    color: #202124;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 18px auto;
}

.header {
    background: #1f2937;
    color: white;
    text-align: center;
    padding: 18px;
    border-radius: 18px;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 26px;
}

.header p {
    margin: 0;
    font-size: 14px;
    opacity: .85;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 3px 14px rgba(0,0,0,.08);
}
.name-box {
    margin-bottom: 14px;
}

.name-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.name-box input {
    width: 100%;
    border: 1px solid #ccd2d8;
    border-radius: 11px;
    padding: 12px;
    font-size: 17px;
    text-align: right;
    outline: none;
}

.name-box input:focus {
    border-color: #2563eb;
}
.inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.input-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.input-box input {
    width: 100%;
    border: 1px solid #ccd2d8;
    border-radius: 11px;
    padding: 12px;
    font-size: 17px;
    text-align: center;
    outline: none;
}

.input-box input:focus {
    border-color: #2563eb;
}

svg {
    display: block;
    width: 100%;
    height: 360px;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 15px;
}

.land {
    fill: #dcefd8;
    stroke: #176b38;
    stroke-width: 3;
}

.side-label {
    font-size: 16px;
    font-weight: bold;
    fill: #202124;
}

.area-box {
    text-align: center;
    margin-top: 14px;
    font-size: 21px;
    font-weight: bold;
}

.area-number {
    color: #176b38;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 13px 8px;
    font-size: 15px;
    font-weight: bold;
}

.save {
    background: #2563eb;
    color: white;
}

.clear {
    background: #dc2626;
    color: white;
}

.reset {
    background: #6b7280;
    color: white;
}

.note {
    text-align: center;
    color: #666;
    font-size: 13px;
    line-height: 1.9;
}

@media (max-width: 520px) {
    .inputs {
        grid-template-columns: 1fr;
    }

    svg {
        height: 310px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏡 زمین‌یار</h1>
        <p>ترسیم و محاسبه تقریبی زمین</p>
    </div>

    <div class="card">
<div class="name-box">
    <label>نام زمین</label>
    <input id="landName" type="text" placeholder="مثلاً زمین ۳۲۳ متری طبرسی">
</div>
        <div class="inputs">

            <div class="input-box">
                <label>عرض جلو A (متر)</label>
                <input id="A" type="number" min="0" step="0.1" value="20">
            </div>

            <div class="input-box">
                <label>عرض عقب B (متر)</label>
                <input id="B" type="number" min="0" step="0.1" value="18">
            </div>

            <div class="input-box">
                <label>طول راست H (متر)</label>
                <input id="H" type="number" min="0" step="0.1" value="30">
            </div>

            <div class="input-box">
                <label>طول چپ D (متر)</label>
                <input id="D" type="number" min="0" step="0.1" value="28">
            </div>

        </div>

    </div>

    <div class="card">

        <svg viewBox="0 0 600 400">

            <polygon id="land" class="land"></polygon>

            <text id="labelA" class="side-label"></text>
            <text id="labelB" class="side-label"></text>
            <text id="labelH" class="side-label"></text>
            <text id="labelD" class="side-label"></text>

        </svg>

        <div class="area-box">
            مساحت تقریبی:
            <span id="area" class="area-number">0</span>
            مترمربع
        </div>

    </div>

    <div class="card">

        <div class="buttons">
            <button class="save" onclick="saveData()">💾 ذخیره</button>
            <button class="clear" onclick="clearData()">🗑 پاک کردن</button>
            <button class="reset" onclick="resetData()">↩ بازنشانی</button>
        </div>

    </div>

    <div class="card note">
        در این نسخه، زمین به‌صورت یک چهارضلعی سازگار با
        چهار اندازه ورودی ترسیم می‌شود و مساحت به‌صورت تقریبی محاسبه می‌گردد.
    </div>

</div>

<script>
const landName = document.getElementById("landName");
const A = document.getElementById("A");
const B = document.getElementById("B");
const H = document.getElementById("H");
const D = document.getElementById("D");

const land = document.getElementById("land");

const labelA = document.getElementById("labelA");
const labelB = document.getElementById("labelB");
const labelH = document.getElementById("labelH");
const labelD = document.getElementById("labelD");

const area = document.getElementById("area");


function getValue(element) {

    const value = parseFloat(element.value);

    if (!Number.isFinite(value) || value < 0) {
        return 0;
    }

    return value;
}


function updateLand() {

    const a = getValue(A);
    const b = getValue(B);
    const h = getValue(H);
    const d = getValue(D);

    if (a <= 0 || b <= 0 || h <= 0 || d <= 0) {

        land.setAttribute("points", "");

        area.textContent = "0";

        return;
    }


    /*
      مدل هندسی:
      ضلع A در پایین قرار می‌گیرد.
      ضلع B در بالا قرار می‌گیرد.
      H و D دو ضلع جانبی هستند.

      برای رسم پایدار، ارتفاع چهارضلعی از رابطه
      مربوط به اختلاف دو ضلع جانبی و اختلاف دو قاعده
      به‌صورت تقریبی به دست می‌آید.
    */

    const baseDifference = b - a;

    const sideDifference = d * d - h * h;

    let horizontalShift = 0;

    if (Math.abs(baseDifference) > 0.0001) {

        horizontalShift =
            (sideDifference - baseDifference * baseDifference)
            / (2 * baseDifference);

    }


    let heightSquared =
        h * h - horizontalShift * horizontalShift;


    /*
      اگر حالت بالا از نظر هندسی ممکن نباشد،
      از میانگین دو طول برای نمایش پایدار استفاده می‌کنیم.
    */

    let height;

    if (heightSquared > 0) {

        height = Math.sqrt(heightSquared);

    } else {

        height = (h + d) / 2;

    }


    /*
      مختصات واقعی اولیه
    */

    const x1 = 0;
    const y1 = 0;

    const x2 = a;
    const y2 = 0;

    const x4 = horizontalShift;
    const y4 = height;

    const x3 = x4 + b;
    const y3 = height;


    /*
      مقیاس برای قرار گرفتن داخل SVG
    */

    const minX = Math.min(x1, x2, x3, x4);
    const maxX = Math.max(x1, x2, x3, x4);

    const minY = Math.min(y1, y3, y4);
    const maxY = Math.max(y1, y3, y4);

    const width = Math.max(maxX - minX, 1);
    const heightRange = Math.max(maxY - minY, 1);

    const scale =
        Math.min(
            480 / width,
            280 / heightRange
        );


    const offsetX = 300 - ((minX + maxX) / 2) * scale;

// کمی فاصله از بالای کادر
const topMargin = 25;

// انتقال شکل به داخل محدوده SVG
const offsetY = 350 - maxY * scale + topMargin;


    function transform(x, y) {

        return [
            x * scale + offsetX,
            offsetY - y * scale
        ];

    }


    const p1 = transform(x1, y1);
    const p2 = transform(x2, y2);
    const p3 = transform(x3, y3);
    const p4 = transform(x4, y4);


    land.setAttribute(
        "points",
        `${p1[0]},${p1[1]}
         ${p2[0]},${p2[1]}
         ${p3[0]},${p3[1]}
         ${p4[0]},${p4[1]}`
    );


    /*
      برچسب‌ها
    */

    labelA.setAttribute("x", (p1[0] + p2[0]) / 2);
    labelA.setAttribute("y", (p1[1] + p2[1]) / 2 + 30);
    labelA.setAttribute("text-anchor", "middle");
    labelA.textContent = `A = ${a} m`;


    labelB.setAttribute("x", (p3[0] + p4[0]) / 2);
    labelB.setAttribute("y", (p3[1] + p4[1]) / 2 - 15);
    labelB.setAttribute("text-anchor", "middle");
    labelB.textContent = `B = ${b} m`;


    labelH.setAttribute("x", (p2[0] + p3[0]) / 2 + 12);
    labelH.setAttribute("y", (p2[1] + p3[1]) / 2);
    labelH.setAttribute("text-anchor", "start");
    labelH.textContent = `H = ${h} m`;


    labelD.setAttribute("x", (p1[0] + p4[0]) / 2 - 12);
    labelD.setAttribute("y", (p1[1] + p4[1]) / 2);
    labelD.setAttribute("text-anchor", "end");
    labelD.textContent = `D = ${d} m`;


    /*
      مساحت چهارضلعی با فرمول Shoelace
    */

    const calculatedArea =
        Math.abs(
            (
                x1 * y2 +
                x2 * y3 +
                x3 * y4 +
                x4 * y1 -
                (
                    y1 * x2 +
                    y2 * x3 +
                    y3 * x4 +
                    y4 * x1
                )
            ) / 2
        );


    area.textContent =
        calculatedArea.toFixed(2);

}

let savedLands = JSON.parse(
    localStorage.getItem("zaminYarLands") || "[]"
);

function renderSavedLands() {

    const list = document.getElementById("landsList");

    if (!savedLands.length) {
        list.innerHTML = '<div class="no-land">هنوز زمینی ذخیره نشده است.</div>';
        return;
    }

    list.innerHTML = "";

    savedLands.forEach((land, index) => {

        const item = document.createElement("div");
        item.className = "land-item";

        const title = document.createElement("span");
        title.textContent = land.name || `زمین ${index + 1}`;

        const button = document.createElement("button");
        button.textContent = "باز کردن";

        button.onclick = function () {
            landName.value = land.name || "";
            A.value = land.A;
            B.value = land.B;
            H.value = land.H;
            D.value = land.D;

            updateLand();
        };

        item.appendChild(title);
        item.appendChild(button);

        list.appendChild(item);
    });
}
function saveData() {

    const data = {
        name: landName.value.trim() || "زمین بدون نام",
        A: A.value,
        B: B.value,
        H: H.value,
        D: D.value
    };

    savedLands.push(data);

    localStorage.setItem(
        "zaminYarLands",
        JSON.stringify(savedLands)
    );

    renderSavedLands();

    alert("زمین با موفقیت ذخیره شد ✅");
}


function clearData() {

    A.value = "";
    B.value = "";
    H.value = "";
    D.value = "";

    updateLand();

}


function resetData() {

    A.value = 20;
    B.value = 18;
    H.value = 30;
    D.value = 28;

    updateLand();

}


function loadData() {

    const saved =
        localStorage.getItem("zaminYarData");

    if (!saved) {

        updateLand();

        return;

    }

    try {

        const data =
            JSON.parse(saved);
landName.value = data.name || "";
        A.value = data.A;
        B.value = data.B;
        H.value = data.H;
        D.value = data.D;

    } catch (error) {

        console.log("خطا در اطلاعات ذخیره شده");

    }

    updateLand();

}


[A, B, H, D].forEach(
    input => input.addEventListener(
        "input",
        updateLand
    )
);


loadData();
renderSavedLands();
</script>

</body>
</html>
